<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img" aria-labelledby="title description">
  <title id="title">Oracle Database Monitoring Agent Architecture</title>
  <desc id="description">A presenter uses Private Agent Factory. The Agent calls Select AI Bridge, which connects as DB_HEALTH_AGENT to a Select AI profile and five monitoring views. PAF repository accounts are separate. Agent and Select AI models have separate connections.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#52667a"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18354a; }
      .title { font-size: 30px; font-weight: 700; }
      .section { font-size: 22px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .body { font-size: 17px; }
      .note { font-size: 15px; fill: #52667a; }
      .line { fill: none; stroke: #52667a; stroke-width: 2.5; marker-end: url(#arrow); }
      .two { marker-start: url(#arrow); }
      .dashed { stroke-dasharray: 7 6; }
      .box { fill: #fff; stroke: #a7bbc9; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1400" height="1020" fill="#f7f9fb"/>
  <text x="60" y="54" class="title">Oracle Database Monitoring Agent</text>
  <text x="60" y="84" class="body">Demo architecture · Private Agent Factory 26.7 + Select AI</text>

  <rect x="340" y="112" width="300" height="62" rx="12" class="box"/>
  <text x="490" y="139" text-anchor="middle" class="label">Presenter browser</text>
  <text x="490" y="162" text-anchor="middle" class="note">Playground · questions and answers</text>
  <path d="M490 174 V205" class="line two"/>

  <rect x="60" y="210" width="840" height="350" rx="18" fill="#e9f2f8" stroke="#b6cedd"/>
  <text x="86" y="247" class="section">Private Agent Factory</text>
  <rect x="92" y="288" width="180" height="80" rx="12" class="box"/>
  <text x="182" y="334" text-anchor="middle" class="label">Chat Input</text>
  <rect x="350" y="280" width="280" height="98" rx="12" fill="#183f58"/>
  <text x="490" y="312" text-anchor="middle" style="fill:white" class="label">Monitoring Agent</text>
  <text x="490" y="338" text-anchor="middle" style="fill:#e2eef5" class="body">Instructions + tool calling</text>
  <text x="490" y="361" text-anchor="middle" style="fill:#e2eef5" class="note">Memory disabled</text>
  <rect x="708" y="288" width="160" height="80" rx="12" class="box"/>
  <text x="788" y="334" text-anchor="middle" class="label">Chat Output</text>
  <path d="M272 328 H350" class="line"/>
  <path d="M630 328 H708" class="line"/>
  <rect x="350" y="448" width="280" height="78" rx="12" class="box"/>
  <text x="490" y="479" text-anchor="middle" class="label">Select AI Bridge</text>
  <text x="490" y="505" text-anchor="middle" class="body">Profile / Run SQL</text>
  <path d="M490 378 V448" class="line two"/>
  <text x="510" y="416" class="note">Tool calls / results</text>

  <rect x="980" y="210" width="360" height="350" rx="18" fill="#f3eef8" stroke="#ccbfdd"/>
  <text x="1004" y="247" class="section">Approved model endpoints</text>
  <rect x="1004" y="280" width="312" height="98" rx="12" class="box"/>
  <text x="1160" y="312" text-anchor="middle" class="label">Agent model</text>
  <text x="1160" y="338" text-anchor="middle" class="body">Interpret the request</text>
  <text x="1160" y="361" text-anchor="middle" class="body">Explain returned evidence</text>
  <path d="M630 298 H1004" class="line two"/>
  <rect x="1004" y="448" width="312" height="78" rx="12" class="box"/>
  <text x="1160" y="479" text-anchor="middle" class="label">Select AI model</text>
  <text x="1160" y="505" text-anchor="middle" class="body">Generate SQL</text>

  <rect x="60" y="630" width="1280" height="308" rx="18" fill="#edf4ed" stroke="#bdcfbd"/>
  <text x="86" y="668" class="section">Autonomous AI Database 26ai</text>
  <rect x="86" y="700" width="260" height="172" rx="12" class="box"/>
  <text x="216" y="733" text-anchor="middle" class="label">PAF repository</text>
  <text x="216" y="769" text-anchor="middle" class="body">PAF_REPOSITORY</text>
  <text x="216" y="795" text-anchor="middle" class="body">AAI_RO_PAF_REPOSITORY</text>
  <text x="216" y="835" text-anchor="middle" class="note">Configuration, flows and state</text>
  <path d="M120 560 V700" class="line dashed"/>
  <text x="135" y="605" class="note">Separate repository access</text>

  <rect x="390" y="700" width="300" height="172" rx="12" class="box"/>
  <text x="540" y="733" text-anchor="middle" class="label">Select AI profile</text>
  <text x="540" y="765" text-anchor="middle" class="body">DB_HEALTH_AGENT</text>
  <text x="540" y="803" text-anchor="middle" class="note">Login: DB_HEALTH_AGENT</text>
  <text x="540" y="835" text-anchor="middle" class="note">Generate and execute SQL</text>
  <path d="M490 526 V700" class="line two"/>
  <text x="510" y="599" class="note">Runtime database connection</text>
  <path d="M690 720 H940 V487 H1004" class="line two"/>
  <text x="960" y="600" class="note">Database-to-model access</text>

  <rect x="738" y="750" width="274" height="122" rx="12" class="box"/>
  <text x="875" y="780" text-anchor="middle" class="label">Five MONITOR_* views</text>
  <text x="875" y="808" text-anchor="middle" class="body">Identity · sessions · storage</text>
  <text x="875" y="834" text-anchor="middle" class="body">Job runs · SQL workload</text>
  <path d="M690 812 H738" class="line"/>
  <rect x="1060" y="750" width="254" height="122" rx="12" class="box"/>
  <text x="1187" y="782" text-anchor="middle" class="label">Monitoring sources</text>
  <text x="1187" y="813" text-anchor="middle" class="body">SYS views</text>
  <text x="1187" y="839" text-anchor="middle" class="body">Database context</text>
  <path d="M1012 812 H1060" class="line"/>
  <text x="86" y="910" class="note">Demo option: share one database with separate schemas, or host the PAF repository in another database.</text>
  <text x="60" y="976" class="note">Model endpoints may be outside the PAF network. Monitoring is on demand; current and cumulative evidence has scope limits.</text>
</svg>
